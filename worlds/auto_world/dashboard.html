<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto World Bot Dashboard</title>
  <style>
    :root {
      --bg-base: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --bg-card: rgba(30, 41, 59, 0.85);
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #38bdf8;
      --accent-success: #22c55e;
      --accent-warning: #eab308;
      --accent-danger: #ef4444;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      --accent-cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-title { display: flex; align-items: center; gap: 0.75rem; }
    .header-title h1 { font-size: 1.35rem; font-weight: 700; color: var(--accent-primary); letter-spacing: -0.5px; }
    .server-badge {
      font-size: 0.8rem;
      background: #0f172a;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .ws-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-danger);
    }
    .status-dot.connected { background-color: var(--accent-success); box-shadow: 0 0 8px var(--accent-success); }

    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Global Control Toolbar */
    .toolbar {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    button {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
    }
    button:hover { background-color: #475569; border-color: #64748b; }
    button:active { transform: scale(0.98); }

    button.btn-primary { background-color: #0284c7; border-color: #0369a1; }
    button.btn-primary:hover { background-color: #0369a1; }
    button.btn-success { background-color: #16a34a; border-color: #15803d; }
    button.btn-success:hover { background-color: #15803d; }
    button.btn-warning { background-color: #ca8a04; border-color: #a16207; }
    button.btn-warning:hover { background-color: #a16207; }
    button.btn-danger { background-color: #dc2626; border-color: #b91c1c; }
    button.btn-danger:hover { background-color: #b91c1c; }
    button.btn-purple { background-color: #9333ea; border-color: #7e22ce; }
    button.btn-purple:hover { background-color: #7e22ce; }

    .input-control {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    input[type="number"], input[type="text"] {
      background-color: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    input[type="number"] { width: 70px; }

    /* Progress Graph / Chart Section */
    .chart-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .section-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .chart-row {
      display: grid;
      grid-template-columns: 100px 1fr 90px;
      align-items: center;
      gap: 1rem;
    }
    .chart-label { font-size: 0.85rem; font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .chart-bar-bg {
      background: var(--bg-base);
      height: 22px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-color);
    }
    .chart-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 5px;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }
    .chart-bar-fill.goaled {
      background: linear-gradient(90deg, #16a34a, #22c55e);
    }
    .chart-stat { font-size: 0.8rem; color: var(--text-muted); text-align: right; }

    /* Bot Grid Cards */
    .bot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.25rem;
    }

    .bot-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      position: relative;
      overflow: hidden;
    }
    .bot-card.goaled {
      border-color: #16a34a;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
    }
    .bot-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bot-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-online { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-active { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-paused { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }

    .goal-banner {
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.25), rgba(34, 197, 94, 0.15));
      border: 1px solid #16a34a;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      color: #4ade80;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .progress-bar-bg {
      background: var(--bg-base);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent-primary);
      border-radius: 5px;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.goaled { background: var(--accent-success); }

    .keys-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      min-height: 28px;
    }
    .key-badge {
      font-size: 0.75rem;
      background: var(--bg-base);
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .key-badge.token {
      border-color: #f59e0b;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      font-weight: 700;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border-color);
    }
    .card-actions button { font-size: 0.78rem; padding: 0.35rem 0.65rem; }

    /* Logs Section */
    .log-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 500px;
    }
    .log-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .filter-pill {
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem;
      border-radius: 9999px;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .filter-pill:hover { color: var(--text-main); }
    .filter-pill.active {
      background: var(--accent-primary);
      color: #0f172a;
      border-color: var(--accent-primary);
    }
    .filter-pill.active.pill-check { background: var(--accent-success); border-color: var(--accent-success); }
    .filter-pill.active.pill-item { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .filter-pill.active.pill-hint { background: var(--accent-purple); border-color: var(--accent-purple); color: #fff; }
    .filter-pill.active.pill-goal { background: var(--accent-amber); border-color: var(--accent-amber); }
    .filter-pill.active.pill-death { background: var(--accent-danger); border-color: var(--accent-danger); color: #fff; }

    .log-container {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem;
      overflow-y: auto;
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .log-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      line-height: 1.4;
      word-break: break-all;
    }
    .log-time { color: #64748b; font-size: 0.75rem; min-width: 65px; }
    .log-slot { color: #38bdf8; font-weight: 700; min-width: 65px; }
    .log-tag {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
      min-width: 55px;
      text-align: center;
    }
    .tag-check { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .tag-item { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .tag-hint { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
    .tag-goal { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .tag-chat { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }
    .tag-death { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .tag-error { background: #dc2626; color: #fff; }
    .tag-system { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .log-msg { flex: 1; color: var(--text-main); }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Auto World Dashboard</h1>
      <span class="server-badge" id="serverAddress">Server: ...</span>
    </div>
    <div class="ws-status">
      <div class="status-dot" id="wsDot"></div>
      <span id="wsStatusText">Connecting...</span>
    </div>
  </header>

  <main>
    <!-- Global Toolbar -->
    <div class="toolbar">
      <div class="btn-group">
        <button class="btn-warning" onclick="sendCmd('pause')">⏸ Pause All</button>
        <button class="btn-success" onclick="sendCmd('resume')">▶ Resume All</button>
        <button class="btn-primary" onclick="sendCmd('check all 1')">⚡ Check +1 All</button>
        <button class="btn-primary" onclick="sendCmd('check all 5')">⚡ Check +5 All</button>
        <button class="btn-purple" onclick="sendCmd('goal all')">🏆 Goal All</button>
      </div>

      <div class="btn-group">
        <div class="input-control">
          <label>Interval:</label>
          <input type="number" id="globalInterval" value="30" min="1" max="3600">
          <button onclick="setGlobalInterval()">Set</button>
        </div>
        <div class="input-control">
          <label>Variance (%):</label>
          <input type="number" id="globalVariance" value="30" min="0" max="90">
          <button onclick="setGlobalVariance()">Set</button>
        </div>
      </div>
    </div>

    <!-- Graph / Chart Comparison Section -->
    <div class="chart-section">
      <div class="section-header">
        <span>Slot Progression Overview</span>
        <span id="completionStat" style="font-size: 0.85rem; color: var(--text-muted);">0 / 0 Goals Achieved</span>
      </div>
      <div class="chart-container" id="chartContainer">
        <!-- Dynamic Chart Bars -->
      </div>
    </div>

    <!-- Bots Grid -->
    <div class="section-header" style="margin-bottom: -0.5rem;">
      <span>Managed Bots</span>
    </div>
    <div class="bot-grid" id="botGrid">
      <!-- Dynamic Bot Cards -->
    </div>

    <!-- Live Filterable Logs -->
    <div class="log-section">
      <div class="section-header" style="margin-bottom: 0;">
        <span>Live Server & Bot Log Stream</span>
        <div class="btn-group">
          <button onclick="clearLogs()" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">Clear</button>
          <label style="font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem;">
            <input type="checkbox" id="autoScroll" checked> Auto-scroll
          </label>
        </div>
      </div>

      <div class="log-controls">
        <div class="filter-pills" id="categoryFilters">
          <div class="filter-pill active" data-cat="all">All</div>
          <div class="filter-pill pill-check" data-cat="check">Checks</div>
          <div class="filter-pill pill-item" data-cat="item">Items</div>
          <div class="filter-pill pill-hint" data-cat="hint">Hints</div>
          <div class="filter-pill pill-goal" data-cat="goal">Goals</div>
          <div class="filter-pill" data-cat="chat">Chat / Server</div>
          <div class="filter-pill pill-death" data-cat="death">DeathLink</div>
          <div class="filter-pill" data-cat="error">Errors</div>
        </div>

        <div class="btn-group">
          <select id="slotFilter" onchange="renderLogs()" style="background: var(--bg-base); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.8rem;">
            <option value="all">All Slots</option>
          </select>
          <input type="text" id="textSearch" placeholder="Search logs..." oninput="renderLogs()" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; width: 150px;">
        </div>
      </div>

      <div class="log-container" id="logContainer">
        <!-- Dynamic Log Rows -->
      </div>
    </div>
  </main>

  <script>
    let ws = null;
    let botsData = [];
    let logsData = [];
    let currentCategory = 'all';

    function initWebSocket() {
      const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws';
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('wsDot').classList.add('connected');
        document.getElementById('wsStatusText').innerText = 'Connected';
      };

      ws.onclose = () => {
        document.getElementById('wsDot').classList.remove('connected');
        document.getElementById('wsStatusText').innerText = 'Disconnected, retrying...';
        setTimeout(initWebSocket, 2000);
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'init') {
            document.getElementById('serverAddress').innerText = 'Server: ' + msg.server_address;
            botsData = msg.bots || [];
            logsData = msg.logs || [];
            updateSlotDropdown();
            renderDashboard();
            renderLogs();
          } else if (msg.type === 'state') {
            botsData = msg.bots || [];
            updateSlotDropdown();
            renderDashboard();
          } else if (msg.type === 'log') {
            logsData.push(msg.entry);
            if (logsData.length > 2000) logsData.shift();
            appendLogRow(msg.entry);
          }
        } catch (e) {
          console.error(e);
        }
      };
    }

    function sendCmd(command) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ command: command }));
      }
    }

    function setGlobalInterval() {
      const val = document.getElementById('globalInterval').value;
      if (val) sendCmd(`interval ${val}`);
    }

    function setGlobalVariance() {
      const val = document.getElementById('globalVariance').value;
      if (val) sendCmd(`variance ${val}`);
    }

    function updateSlotDropdown() {
      const select = document.getElementById('slotFilter');
      const current = select.value;
      select.innerHTML = '<option value="all">All Slots</option>';
      botsData.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.name;
        opt.innerText = b.name;
        select.appendChild(opt);
      });
      select.value = current || 'all';
    }

    function renderDashboard() {
      // 1. Chart Section
      const chartContainer = document.getElementById('chartContainer');
      chartContainer.innerHTML = '';
      let totalGoals = 0;

      botsData.forEach(bot => {
        const total = (bot.checked_count + bot.missing_count) || 1;
        const pct = Math.min(100, Math.round((bot.checked_count / total) * 100));
        if (bot.finished_game) totalGoals++;

        const row = document.createElement('div');
        row.className = 'chart-row';
        row.innerHTML = `
          <div class="chart-label">${bot.name} ${bot.finished_game ? '🏆' : ''}</div>
          <div class="chart-bar-bg">
            <div class="chart-bar-fill ${bot.finished_game ? 'goaled' : ''}" style="width: ${Math.max(4, pct)}%">${pct}%</div>
          </div>
          <div class="chart-stat">${bot.checked_count}/${total} checks</div>
        `;
        chartContainer.appendChild(row);
      });

      document.getElementById('completionStat').innerText = `${totalGoals} / ${botsData.length} Goals Achieved`;

      // 2. Bot Cards
      const botGrid = document.getElementById('botGrid');
      botGrid.innerHTML = '';

      botsData.forEach(bot => {
        const total = (bot.checked_count + bot.missing_count) || 1;
        const pct = Math.min(100, Math.round((bot.checked_count / total) * 100));

        const card = document.createElement('div');
        card.className = `bot-card ${bot.finished_game ? 'goaled' : ''}`;

        const keysHtml = bot.keys.map(k => {
          const isToken = k.includes('Token');
          return `<span class="key-badge ${isToken ? 'token' : ''}">${k}</span>`;
        }).join('');

        card.innerHTML = `
          <div class="bot-card-header">
            <div class="bot-name">
              ${bot.name}
              <span class="badge ${bot.connected ? 'badge-online' : 'badge-offline'}">${bot.connected ? 'Connected' : 'Disconnected'}</span>
              <span class="badge ${bot.auto_enabled ? 'badge-active' : 'badge-paused'}">${bot.auto_enabled ? 'Active' : 'Paused'}</span>
            </div>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Slot ${bot.slot || '-'}</span>
          </div>

          ${bot.finished_game ? '<div class="goal-banner">🏆 GOAL COMPLETED! (Victory achieved)</div>' : ''}

          <div class="progress-info">
            <span>Progress: ${bot.checked_count} / ${total} checks (${pct}%)</span>
            <span>Interval: ${bot.interval}s (±${Math.round(bot.variance * 100)}%)</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill ${bot.finished_game ? 'goaled' : ''}" style="width: ${pct}%"></div>
          </div>

          <div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.3rem;">Held Keys / Goal Items:</div>
            <div class="keys-container">${keysHtml || '<span style="font-size: 0.75rem; color: #64748b;">None yet</span>'}</div>
          </div>

          <div class="card-actions">
            <button class="btn-primary" onclick="sendCmd('check ${bot.name} 1')">+1 Check</button>
            <button class="btn-primary" onclick="sendCmd('check ${bot.name} 5')">+5 Checks</button>
            <button class="btn-purple" onclick="sendCmd('hint ${bot.name} missing')">💡 Hint</button>
            <button class="btn-warning" onclick="sendCmd('${bot.auto_enabled ? 'pause' : 'resume'} ${bot.name}')">${bot.auto_enabled ? '⏸ Pause' : '▶ Resume'}</button>
            <button class="btn-success" onclick="sendCmd('goal ${bot.name}')">🏆 Goal</button>
            <button class="btn-danger" onclick="sendCmd('death ${bot.name}')">💀 Death</button>
            <button onclick="sendCmd('${bot.connected ? 'disconnect' : 'connect'} ${bot.name}')">${bot.connected ? 'Disconnect' : 'Connect'}</button>
          </div>
        `;
        botGrid.appendChild(card);
      });
    }

    // Filter pills handler
    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentCategory = pill.getAttribute('data-cat');
        renderLogs();
      });
    });

    function renderLogs() {
      const container = document.getElementById('logContainer');
      container.innerHTML = '';
      const selectedSlot = document.getElementById('slotFilter').value;
      const search = document.getElementById('textSearch').value.toLowerCase();

      const filtered = logsData.filter(entry => {
        if (currentCategory !== 'all' && entry.category !== currentCategory) return false;
        if (selectedSlot !== 'all' && entry.slot !== selectedSlot) return false;
        if (search && !entry.message.toLowerCase().includes(search) && !entry.slot.toLowerCase().includes(search)) return false;
        return true;
      });

      filtered.forEach(entry => {
        container.appendChild(createLogRowElement(entry));
      });

      if (document.getElementById('autoScroll').checked) {
        container.scrollTop = container.scrollHeight;
      }
    }

    function appendLogRow(entry) {
      const selectedSlot = document.getElementById('slotFilter').value;
      const search = document.getElementById('textSearch').value.toLowerCase();

      if (currentCategory !== 'all' && entry.category !== currentCategory) return;
      if (selectedSlot !== 'all' && entry.slot !== selectedSlot) return;
      if (search && !entry.message.toLowerCase().includes(search) && !entry.slot.toLowerCase().includes(search)) return;

      const container = document.getElementById('logContainer');
      container.appendChild(createLogRowElement(entry));

      if (document.getElementById('autoScroll').checked) {
        container.scrollTop = container.scrollHeight;
      }
    }

    function createLogRowElement(entry) {
      const div = document.createElement('div');
      div.className = 'log-row';
      div.innerHTML = `
        <span class="log-time">${entry.time}</span>
        <span class="log-slot">[${entry.slot}]</span>
        <span class="log-tag tag-${entry.category}">${entry.category}</span>
        <span class="log-msg">${escapeHtml(entry.message)}</span>
      `;
      return div;
    }

    function clearLogs() {
      logsData = [];
      renderLogs();
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.onload = initWebSocket;
  </script>
</body>
</html>
